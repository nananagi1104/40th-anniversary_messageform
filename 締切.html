<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アンケート締め切り</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: #ffffff;
      color: #111111;
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 60px 40px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.8s ease forwards;
      animation-delay: 0.2s;
    }

    .divider-top {
      width: 40px;
      height: 1px;
      background-color: #111111;
      margin: 0 auto 40px;
      transform: scaleX(0);
      transform-origin: left;
      animation: lineExpand 0.6s ease forwards;
      animation-delay: 0.7s;
    }

    .message-thanks {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      letter-spacing: 0.15em;
      line-height: 2;
      color: #111111;
      margin-bottom: 16px;
    }

    .message-closed {
      font-family: 'Noto Serif JP', serif;
      font-weight: 400;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      letter-spacing: 0.15em;
      line-height: 2;
      color: #111111;
    }

    .divider-bottom {
      width: 40px;
      height: 1px;
      background-color: #111111;
      margin: 40px auto 0;
      transform: scaleX(0);
      transform-origin: right;
      animation: lineExpand 0.6s ease forwards;
      animation-delay: 0.9s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lineExpand {
      to {
        transform: scaleX(1);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="divider-top"></div>
    <p class="message-thanks">ご回答いただきありがとうございました。</p>
    <p class="message-closed">このアンケートは締め切りました。</p>
    <div class="divider-bottom"></div>
  </div>
</body>
</html>
